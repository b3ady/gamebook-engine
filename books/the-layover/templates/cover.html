<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#07080a}
  .c{position:relative;width:1600px;height:2560px;overflow:hidden;background:#07080a;font-family:'Inter Display','Inter',sans-serif;color:#f2f0ea}
  .board{position:absolute;left:110px;right:110px;top:120px;background:#0e1013;border:4px solid #1d2026;border-radius:10px;padding:34px 40px 26px}
  .bh{display:flex;justify-content:space-between;font:800 44px 'Inter Display';letter-spacing:.32em;color:#8e939c;margin-bottom:22px}
  .row{display:grid;grid-template-columns:200px 1fr 330px;gap:22px;margin:12px 0;font:700 50px 'DejaVu Sans Mono',monospace;color:#f5b10a;letter-spacing:.04em}
  .row span{background:#16181c;padding:10px 14px;border-radius:5px;white-space:nowrap;overflow:hidden}
  .row.dim{color:#6e5a20}
  .row.hot span{background:#2a1a00}
  .row.hot .st{color:#ff4d2e;animation:none}
  .title{position:absolute;left:0;right:0;top:760px;text-align:center}
  .title h1{margin:0;font:900 250px/0.9 'Inter Display';letter-spacing:-.01em;color:#f4f1e8}
  .title .sub{margin-top:40px;font:600 50px 'Inter Display';letter-spacing:.42em;color:#c9c4b8}
  svg{position:absolute;left:0;top:1360px;z-index:0}
  .title{z-index:2}
  .sign{position:absolute;left:110px;top:1470px;z-index:3;background:#ffcc00;color:#111;font:900 64px 'Inter Display';padding:18px 34px;border-radius:6px;letter-spacing:.02em}
  .tag{position:absolute;left:0;right:0;bottom:250px;text-align:center;font:600 44px 'Inter Display';letter-spacing:.3em;color:#a7a294}
  .author{position:absolute;left:0;right:0;bottom:110px;text-align:center;font:800 76px 'Inter Display';letter-spacing:.18em;color:#f4f1e8}
</style></head>
<body><div class="c">
  <div class="board">
    <div class="bh"><span>DEPARTURES</span><span>23:52</span></div>
    <div class="row dim"><span>23:10</span><span>GLASSHAVEN</span><span>CANCELLED</span></div>
    <div class="row dim"><span>23:25</span><span>PORT EVER</span><span>CANCELLED</span></div>
    <div class="row hot"><span>23:52</span><span>LV 137 · GATE 0</span><span class="st">DELAYED</span></div>
    <div class="row dim"><span>00:15</span><span>HOLLOWMOUTH</span><span>CANCELLED</span></div>
  </div>

  <div class="title">
    <h1>THE<br>LAYOVER</h1>
    <div class="sub">AN INTERACTIVE HORROR NOVEL</div>
  </div>

  <svg width="1600" height="1050" viewBox="0 0 1600 1050">
    <defs>
      <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#15171a"/><stop offset="1" stop-color="#2a2c2f"/>
      </linearGradient>
      <linearGradient id="ceil" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#0c0d0f"/><stop offset="1" stop-color="#1b1d20"/>
      </linearGradient>
      <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#fff6d8" stop-opacity=".55"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#07080a" stop-opacity="1"/><stop offset=".18" stop-color="#07080a" stop-opacity="0"/>
        <stop offset=".8" stop-color="#07080a" stop-opacity="0"/><stop offset="1" stop-color="#07080a" stop-opacity="1"/>
      </linearGradient>
    </defs>
    <!-- vanishing point 800,430 -->
    <polygon points="0,1050 1600,1050 840,440 760,440" fill="url(#floor)"/>
    <polygon points="0,40 1600,40 840,420 760,420" fill="url(#ceil)"/>
    <polygon points="0,40 760,420 760,440 0,1050" fill="#101215"/>
    <polygon points="1600,40 840,420 840,440 1600,1050" fill="#0d0f12"/>
    <!-- ceiling light strips receding (some out) -->
    <g fill="#fffbe8">
      <polygon points="610,95 990,95 950,128 650,128" opacity=".95"/>
      <polygon points="676,205 924,205 900,226 700,226" opacity=".85"/>
      <polygon points="716,276 884,276 870,289 730,289" opacity=".15"/>
      <polygon points="742,323 858,323 849,332 751,332" opacity=".7"/>
      <polygon points="760,354 840,354 834,360 766,360" opacity=".6"/>
      <polygon points="772,375 828,375 824,379 776,379" opacity=".1"/>
      <polygon points="780,390 820,390 817,393 783,393" opacity=".5"/>
    </g>
    <!-- floor reflections -->
    <g fill="#fffbe8" opacity=".06">
      <polygon points="560,1000 1040,1000 980,930 620,930"/>
      <polygon points="690,780 910,780 890,750 710,750"/>
    </g>
    <!-- gate pillars -->
    <g fill="#08090b">
      <polygon points="140,170 230,220 230,860 140,930"/>
      <polygon points="1460,170 1370,220 1370,860 1460,930"/>
      <polygon points="470,310 510,330 510,640 470,665"/>
      <polygon points="1130,310 1090,330 1090,640 1130,665"/>
      <polygon points="640,380 656,388 656,515 640,525"/>
      <polygon points="960,380 944,388 944,515 960,525"/>
    </g>
    <circle cx="800" cy="430" r="110" fill="url(#glow)"/>
    <!-- the tall passenger, far end: too tall, too thin, holding a sign -->
    <g transform="translate(800 446) scale(2.1) translate(0 0)">
      <path d="M-5,-2 L-4,-62 Q-6,-70 -3,-76 L3,-76 Q6,-70 4,-62 L5,-2 Z" fill="#000"/>
      <ellipse cx="0" cy="-81" rx="3.4" ry="4.6" fill="#000"/>
      <path d="M-4,-58 L-12,-46 L-11,-44 L-3,-53 Z M4,-58 L12,-46 L11,-44 L3,-53 Z" fill="#000"/>
      <rect x="-15" y="-49" width="30" height="13" fill="#f4f1e8"/>
      <rect x="-12" y="-45" width="24" height="1.4" fill="#222"/><rect x="-12" y="-41.5" width="18" height="1.4" fill="#222"/>
    </g>
    <rect x="0" y="0" width="1600" height="1050" fill="url(#fade)"/>
  </svg>
  <div class="sign">GATE 0 →</div>

  <div class="tag">YOU CHOOSE. IT WAITS.</div>
  <div class="author">AUTHOR_NAME</div>
</div></body></html>
